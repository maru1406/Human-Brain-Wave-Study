{% extends 'dashboard/base_dashboard.html' %}

{% block content %}

<h3>Advanced AI Prediction</h3>

<div class="card p-4 shadow">

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Upload Signal (.npy)</label>
        <input type="file" name="input_file" class="form-control" accept=".npy" required>
    </div>

    <button class="btn btn-primary">Run Prediction</button>
</form>

{% if result %}
<div class="alert alert-success mt-4">
Prediction Result: <b>{{ result }}</b><br>
Confidence: <b>{{ confidence }}%</b>
</div>
{% endif %}

</div>

{% endblock %}
